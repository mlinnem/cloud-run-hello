trigger:
- master

resources:
- repo: self

variables:
  dockerHubImageName: mwlinnem/test-image
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build and Push Docker Image
  jobs:
  - job: BuildAndPush
    displayName: Build and Push
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Login to Docker Hub
      inputs:
        command: login
        containerRegistry: 'dockerServiceConnection'  # Name of your Docker Hub service connection

    - task: Docker@2
      displayName: Build Docker Image
      inputs:
        command: build
        repository: $(dockerHubImageName)
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(dockerHubImageName):$(tag)

    - task: Docker@2
      displayName: Push Docker Image
      inputs:
        command: push
        repository: $(dockerHubImageName)
        tags: |
          $(dockerHubImageName):$(tag)